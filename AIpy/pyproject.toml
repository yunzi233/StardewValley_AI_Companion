[project]
name = "aipy"
version = "0.1.0"
description = "A Stardew Valley AI Companion"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "typing-extensions>=4.16.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
aipy = "aipy:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
